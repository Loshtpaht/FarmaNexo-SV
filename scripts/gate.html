<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#163d34"><title>Acceso · FarmaNexo</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f3f6ef;font:15px system-ui,sans-serif;color:#234b3b;padding:22px}.card{width:min(430px,100%);padding:36px;background:white;border:1px solid #dfe7d8;border-radius:16px;box-shadow:0 18px 60px #163d3410}.brand{display:flex;gap:12px;align-items:center;font-weight:700;font-size:25px;letter-spacing:-1px}.mark{display:grid;place-items:center;background:#d9ebc9;border-radius:11px;width:43px;height:43px;color:#27563e;font-size:27px}h1{font-size:22px;font-weight:600;margin:30px 0 10px;letter-spacing:-.5px}p{font-size:13px;color:#76866b;line-height:1.7;margin:0 0 23px}label{font-size:12px;display:block;margin-bottom:9px;color:#637c52}.input{display:flex;border:1px solid #cdddc2;border-radius:7px;overflow:hidden}.input input{border:0;padding:13px;width:100%;min-width:0;font-size:14px;color:#234b3b;outline:none}.input:focus-within{outline:3px solid #c8dcb5}.input button{border:0;background:#f4f8ef;color:#6a805a;font-size:11px;padding:0 12px;cursor:pointer}#enter{width:100%;background:#24694f;color:white;border:0;border-radius:7px;padding:14px;font-size:13px;font-weight:600;margin-top:16px;cursor:pointer}#enter:disabled{opacity:.6;cursor:wait}#error{font-size:12px;color:#b45445;min-height:20px;margin:12px 0 0}small{display:block;font-size:10px;line-height:1.7;color:#94a089;border-top:1px solid #e5ecde;padding-top:20px;margin-top:17px}button:focus-visible{outline:3px solid #bed4a9;outline-offset:3px}.eyebrow{font-size:9px;letter-spacing:2px;color:#9aa88e;margin-top:8px}</style></head><body><main class="card"><div class="brand"><span class="mark">✚</span>FarmaNexo</div><div class="eyebrow">SEGUIMIENTO DE FARMACIAS · EL SALVADOR</div><h1>Tu espacio de seguimiento.</h1><p>Introduce la contraseña para abrir el dashboard y el apartado de medicamentos ISBM.</p><form id="accessForm"><label for="password">Contraseña de acceso</label><div class="input"><input type="password" id="password" required autocomplete="current-password" spellcheck="false" autofocus><button type="button" id="show" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button></div><button id="enter" type="submit">Abrir dashboard →</button><div id="error" role="alert" aria-live="polite"></div></form><small>El acceso se bloquea al recargar o pulsar «Bloquear». Las consultas continúan guardadas en este navegador.</small></main><script>
(()=>{'use strict';const form=document.getElementById('accessForm'),input=document.getElementById('password'),error=document.getElementById('error'),button=document.getElementById('enter'),toggle=document.getElementById('show');toggle.onclick=()=>{const reveal=input.type==='password';input.type=reveal?'text':'password';toggle.textContent=reveal?'Ocultar':'Mostrar';toggle.setAttribute('aria-pressed',String(reveal));toggle.setAttribute('aria-label',reveal?'Ocultar contraseña':'Mostrar contraseña')};const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));form.onsubmit=async e=>{e.preventDefault();error.textContent='';button.disabled=true;button.textContent='Abriendo…';let pack;try{const r=await fetch('dashboard.json',{cache:'no-store'});if(!r.ok)throw Error();pack=await r.json()}catch{error.textContent='No se pudo cargar el dashboard. Revisa tu conexión e intenta de nuevo.';button.disabled=false;button.textContent='Abrir dashboard →';return}try{const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(pack.salt),iterations:pack.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(pack.iv)},key,bytes(pack.ciphertext));const html=new TextDecoder().decode(decrypted);input.value='';document.open();document.write(html);document.close()}catch{error.textContent='Contraseña incorrecta. Revisa e intenta nuevamente.';input.focus();button.disabled=false;button.textContent='Abrir dashboard →'}}})();
</script></body></html>
